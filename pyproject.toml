[project]
name = "weekly-ai-briefing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steven Davis", email = "StevenDavisMA@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "imageio-ffmpeg>=0.6.0",
    "jinja2>=3.1.6",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
weekly-ai-briefing = "weekly_ai_briefing.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.isort]
multi_line_output = 5
include_trailing_comma = true
force_grid_wrap = 0
line_length = 120
